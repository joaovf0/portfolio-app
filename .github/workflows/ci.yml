name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Unit and API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: portfolio_db
          POSTGRES_USER: portfolio_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio_user -d portfolio_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: ci_password
      DATABASE_URL: postgres://portfolio_user:ci_password@127.0.0.1:5432/portfolio_db
      PORT: 3001

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test:unit

      - name: Apply database migrations
        run: pnpm --filter backend migrate:up

      - name: Start API and verify health checks
        shell: bash
        run: |
          nohup pnpm --filter backend start > "$RUNNER_TEMP/backend.log" 2>&1 &

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:3001/api/health/db >/dev/null; then
              echo "API and database are ready."
              exit 0
            fi

            sleep 2
          done

          echo "API did not become ready in time."
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Run API tests
        run: pnpm test:api

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-api-failure-reports
          path: |
            tests/api/playwright-report/
            tests/api/test-results/
          if-no-files-found: ignore